name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3'

      - name: Install dependencies
        run: pip install numpy

      - name: Run tests
        run: make test

  # The JS8 fallback AppImage is committed to this repo precisely so JS8 mode
  # survives GitHub (or the upstream project) being unavailable. A fallback
  # nobody ever executes is a fallback that quietly rots until the day it's
  # needed -- so CI actually launches it and confirms its TCP API comes up.
  js8-fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3'

      # libfuse2: AppImages need FUSE 2, absent on ubuntu-latest by default.
      # xvfb: JS8Call-improved is a Qt GUI and builds its QApplication before
      # parsing argv, so it needs a display even to print --version.
      # The rest: the AppImage bundles Qt6 itself but deliberately does not
      # bundle host graphics/X11 libraries (drivers must come from the system),
      # so a bare server runner is missing libEGL/libGL/xcb/xkbcommon and the
      # app dies with rc=127 before it can open its API. This list is what
      # `ldd` on the bundled JS8Call binary actually asks the host for, plus
      # the xcb platform plugin's own dependencies.
      - name: Install AppImage + headless display support
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfuse2 xvfb \
            libegl1 libgl1 libglx0 libopengl0 \
            libx11-6 libx11-xcb1 libxcb1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxcb-glx0 \
            libfontconfig1 libdbus-1-3 libpulse0 libasound2t64 || \
          sudo apt-get install -y libasound2

      # Checksum, then every dynamic dependency resolves, then it actually
      # launches and stays up. The TCP API is probed and reported but not
      # required: a bare container has no audio device, so JS8Call boots
      # without opening its API socket. See the script's docstring -- the API
      # is verified for real on the operating machine, not here.
      - name: Smoke-test the committed fallback AppImage
        run: xvfb-run -a python3 tools/js8_fallback_smoke.py
